# Traefik v3 static configuration (auto-loaded from /etc/traefik/traefik.yml).
#
# Used only by the "canary" compose profile: Traefik fronts two API builds
# (api = stable, api-next = canary) and splits traffic by weight. The split and
# the backends live in dynamic.yml so they can be re-weighted without a restart.

entryPoints:
  web:
    address: ":80"        # the canary-split entrypoint clients hit
  traefik:
    address: ":8080"      # dashboard (insecure — local only)
  metrics:
    address: ":8082"      # Prometheus scrape target

api:
  dashboard: true
  insecure: true

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog: {}
