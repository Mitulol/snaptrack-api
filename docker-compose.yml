name: snaptrack

services:
  postgres:
    image: postgres:16-alpine
    # max_connections raised for the multi-worker API + Celery pool headroom
    # (see docs/adr/0001-load-test-tuning.md).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: snaptrack
      POSTGRES_PASSWORD: snaptrack
      POSTGRES_DB: snaptrack
    # Not published to the host: other local stacks already hold 5432.
    # Use `docker compose exec postgres psql -U snaptrack` for a shell.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaptrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgresql+psycopg2://snaptrack:snaptrack@postgres:5432/snaptrack
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-6}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
    ports:
      - "8000:8000"
    volumes:
      - photo_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Canary build of the API. Same image, same data plane (Postgres + Redis +
  # photo volume) as `api`; Traefik routes ~10% of traffic here. Only starts
  # with `--profile canary`. See docs/canary-report.md.
  api-next:
    build: .
    command: ["api"]
    profiles: ["canary"]
    environment:
      DATABASE_URL: postgresql+psycopg2://snaptrack:snaptrack@postgres:5432/snaptrack
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-6}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      RELEASE_CHANNEL: next
    volumes:
      - photo_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy   # let `api` run the migrations first
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reverse proxy for the canary split (stable 90 / next 10). `--profile canary`.
  traefik:
    image: traefik:v3.3
    profiles: ["canary"]
    ports:
      - "8080:80"      # canary-split entrypoint — send load here
      - "8081:8080"    # Traefik dashboard (http://localhost:8081/dashboard/)
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
    depends_on:
      api:
        condition: service_healthy
      api-next:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://snaptrack:snaptrack@postgres:5432/snaptrack
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 4
    volumes:
      - photo_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
      # accept k6's Prometheus remote-write during load tests (loadtest/run.sh PROM_RW=1)
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  photo_storage:
  promdata:
  grafanadata:
