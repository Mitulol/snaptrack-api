name: snaptrack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snaptrack
      POSTGRES_PASSWORD: snaptrack
      POSTGRES_DB: snaptrack
    # Not published to the host: other local stacks already hold 5432.
    # Use `docker compose exec postgres psql -U snaptrack` for a shell.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaptrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgresql+psycopg2://snaptrack:snaptrack@postgres:5432/snaptrack
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      WEB_CONCURRENCY: 2
    ports:
      - "8000:8000"
    volumes:
      - photo_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://snaptrack:snaptrack@postgres:5432/snaptrack
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_CONCURRENCY: 2
    volumes:
      - photo_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  photo_storage:
